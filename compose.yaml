services:
  frontend:
    image: node:24-bookworm
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_dependencies:/app/node_modules
      - npm_cache:/root/.npm
    command:
      - sh
      - -c
      - npm install --prefer-offline && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

  backend:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - backend_venv:/venv
      - pip_cache:/root/.cache/pip
    command:
      - sh
      - -c
      - python -m venv /venv && /venv/bin/pip install -r requirements.txt && /venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  frontend_dependencies:
  npm_cache:
  backend_venv:
  pip_cache: