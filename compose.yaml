services:
  frontend:
    build: ./frontend
    image: hackmidwest2026-frontend:dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's node_modules from being hidden by the bind mount.
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    image: hackmidwest2026-backend:dev
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
